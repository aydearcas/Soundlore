<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>

document.documentElement.dataset.theme='dark';

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map layers – Soundlore</title>
<meta name="description" content="Two linked layers: the genre map and an instrument map above it, joined by lines from each instrument to the genres that use it. 2D or 3D.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Prototype of the two-layer map planned for artists, tried first with instruments.
   Lower layer: the genre map. Upper layer: each instrument at the weighted center of the genres that use it.
   2D (default) shows one layer at a time and keeps the selection when switching; 3D shows both planes with vertical links. */
:root{
  --night:#181A3C; --ink:#EEF0FF; --muted:#B9BDE6; --line:rgb(255 255 255 / .16); --chip:rgb(255 255 255 / .07);
  --panel:rgb(20 22 52 / .84); --pink:#EEF0FF; --pmuted:#AEB3DD; --pline:rgb(255 255 255 / .14); --accent:#C3C8FF; --btnbg:rgb(255 255 255 / .06); --hov:rgb(255 255 255 / .08);
  --glass:rgb(20 22 52 / .72); --glass-line:rgb(255 255 255 / .12); --shadow:0 18px 50px -12px rgb(0 0 0 / .6);
  --bgimg:radial-gradient(120% 90% at 50% 30%,#242870 0%,#181A3C 48%,#0E0F27 100%);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --halo:#181A3C;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgb(255 255 255 / .92);--pink:#1D2040;--pmuted:#4A5170;--pline:#DDE1EA;--accent:#3A40C8;--btnbg:#fff;--hov:#F0F1FA;--glass:rgb(255 255 255 / .8);--glass-line:rgb(29 32 64 / .12);--shadow:0 14px 36px -12px rgb(29 32 64 / .3);--bgimg:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#F3F5F9 60%,#E6EAF2 100%);--night:#F3F5F9;--ink:#1D2040;--muted:#4A5170;--line:rgb(29 32 64 / .18);--chip:rgb(29 32 64 / .05);--halo:#F3F5F9;color-scheme:light}}
:root[data-theme="light"]{--panel:rgb(255 255 255 / .92);--pink:#1D2040;--pmuted:#4A5170;--pline:#DDE1EA;--accent:#3A40C8;--btnbg:#fff;--hov:#F0F1FA;--glass:rgb(255 255 255 / .8);--glass-line:rgb(29 32 64 / .12);--shadow:0 14px 36px -12px rgb(29 32 64 / .3);--bgimg:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#F3F5F9 60%,#E6EAF2 100%);--night:#F3F5F9;--ink:#1D2040;--muted:#4A5170;--line:rgb(29 32 64 / .18);--chip:rgb(29 32 64 / .05);--halo:#F3F5F9;color-scheme:light}
.themebtn{min-height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13px var(--body);cursor:pointer}
.embed .themebtn{display:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--night) var(--bgimg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
a{color:inherit}
button{font:inherit}
.bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:linear-gradient(var(--night) 70%,transparent)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none;line-height:1}
.crumb{color:var(--muted);font-size:14px}
.crumb a{color:var(--muted)}
.grow{flex:1 1 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:0 12px;min-height:36px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night);font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button:focus-visible,.chip:focus-visible,.btn:focus-visible,.nb button:focus-visible{outline:2px solid #FFD25C;outline-offset:2px}
.lbl{font-size:12px;color:var(--muted);margin-right:-8px}
.search{position:relative}
.search input{width:min(260px,70vw);min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:0 12px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.sugg{position:absolute;top:40px;left:0;right:0;background:var(--panel);color:var(--pink);border-radius:9px;box-shadow:0 8px 24px rgb(0 0 0 / .35);overflow:hidden;z-index:8}
.sugg button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;color:inherit;text-align:left;padding:8px 12px;cursor:pointer;font-size:14px}
.sugg button:hover,.sugg button.on{background:var(--hov)}
.sugg small{margin-left:auto;color:var(--pmuted)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(8px,-50%);font-size:12px;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 6px var(--halo),0 0 10px var(--halo)}
.lab.big{font-size:14px;font-weight:600}
.lab.plane{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--glass-line);border-radius:6px;padding:3px 8px;text-shadow:none;transform:translate(-4px,-120%)}
.lab.plane::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c,#FFD25C);margin-right:7px;vertical-align:1px}
.lab.sm{font-size:11px;opacity:.92}
.lab.gz{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--pline);color:var(--pink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:280px}
.tip span{display:block;color:var(--pmuted);font-size:12px}
.panel{position:absolute;z-index:5;left:16px;top:120px;width:300px;max-height:calc(100% - 140px);overflow:auto;background:var(--panel);color:var(--pink);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--pline);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);display:flex;flex-direction:column;gap:9px}
.panel .h{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.panel h2{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:2px 0 0}
.panel .kind{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pmuted)}
.panel .kind .sw{margin-right:6px}
.panel p{margin:0;font-size:14px;color:var(--pmuted)}
.panel .x{border:1px solid var(--pline);background:var(--btnbg);color:var(--pink);border-radius:8px;min-width:32px;min-height:32px;cursor:pointer}
.nb{display:flex;flex-direction:column}
.nb button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--pink);padding:4px 0;cursor:pointer;text-align:left;min-height:30px;font-size:14px}
.nb button:hover{color:var(--accent)}
.nb .w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--pmuted)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.sw.ring{box-shadow:0 0 0 2px #fff,0 0 0 3px #9AA0BC}
.sw.sq{border-radius:2px}
.loading{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--pline);color:var(--pink);border-radius:999px;padding:10px 18px 10px 40px;font-size:14px;box-shadow:var(--shadow)}
.loading::before{content:"";position:absolute;left:14px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2px solid var(--pline);border-top-color:#FFD25C;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--pline);color:var(--pink);background:var(--btnbg);text-decoration:none;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.legend{position:absolute;z-index:4;right:16px;bottom:14px;max-width:min(520px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:10px 12px 12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.legend .lt{align-self:flex-start;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:0 10px;min-height:28px;cursor:pointer;font-size:12.5px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.note{font-size:12px;color:var(--muted);text-align:right}
.tools{position:absolute;z-index:4;right:16px;top:120px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.dock{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;padding:4px;gap:2px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.dock button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:500 13px var(--body);min-height:34px;padding:0 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.dock button svg{flex:none;opacity:.85}
.dock button:hover{background:var(--chip)}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.dock .zrow{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.dock .zrow button{justify-content:center;font-size:17px;padding:0}
.dock hr{border:0;border-top:1px solid var(--glass-line);margin:3px 4px}
.zoomread{font:500 10px var(--mono);letter-spacing:.08em;color:var(--muted);text-align:center;padding:2px 0 1px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;padding:8px 12px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hint3{position:absolute;z-index:4;left:16px;bottom:14px;display:flex;gap:14px;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--muted);background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:7px 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hint3 b{color:var(--ink);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){
  .bar{padding:10px 12px;gap:8px 10px}
  .panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:42%}
  .tools{top:12px;right:10px;gap:6px}
  .dock{flex-direction:row;align-items:center;padding:3px}
  .dock button{min-height:38px;min-width:38px;padding:0;justify-content:center}
  .dock .lbl3,.zoomread{display:none}
  .dock hr{border-top:0;border-left:1px solid var(--glass-line);height:22px;margin:0 3px}
  .dock .zrow{display:flex}
  .dock .zrow button{min-width:38px}
  .toggle{display:none}
  .legend{display:none}
  .hint3{display:none}
  .search input{width:calc(100vw - 24px)}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* inside the explorer: the explorer's map bar holds the layer, view and search controls */
.embed .bar{display:none}
.embed .tools{top:12px;right:12px}
.embed .hint3{left:12px;bottom:12px}
.embed .panel{top:12px;left:12px;max-height:calc(100% - 24px)}
.embed .legend{right:12px;bottom:12px}
.embed .note{display:none}
@media (max-width:760px){.embed .panel{top:auto}}
</style>
<style>
/* Slim scrollbars that follow the theme */
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb,rgb(120 126 160 / .45)) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb-thumb,rgb(120 126 160 / .45));border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgb(120 126 160 / .75)}
::-webkit-scrollbar-corner{background:transparent}

<body>
<header class="bar">
  <a class="brand" href="explore.html#map" id="brand" title="Back">Soundlore</a>
  <span class="crumb"><a href="explore.html#map">Map</a> / Layers <span class="lbl">(prototype)</span></span>
  <span class="grow"></span>
  <div class="seg" role="group" aria-label="View"><button type="button" id="v2" aria-pressed="true">2D</button><button type="button" id="v3" aria-pressed="false">3D</button></div>
  <div class="seg" role="group" aria-label="Layer" id="layerseg"><button type="button" id="lg" aria-pressed="true">Genres</button><button type="button" id="li" aria-pressed="false">Instruments</button><button type="button" id="la" aria-pressed="false">Artists</button></div>
  <div class="search"><label class="sr" for="q">Find a genre, instrument or artist</label><input id="q" type="search" autocomplete="off" placeholder="Find a genre, instrument or artist"><div class="sugg" id="sugg" hidden></div></div>
</header>

  <div class="dock" role="group" aria-label="Camera">
    <button type="button" data-cam="tilt" title="Tilted view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l9 4 9-4M3 10.5l9 4 9-4M12 3 3 7l9 4 9-4z"/></svg><span class="lbl3">Tilt</span></button>
    <button type="button" data-cam="top" title="From above"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="2.2"/></svg><span class="lbl3">Top</span></button>
    <button type="button" data-cam="side" title="From the side"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span class="lbl3">Side</span></button>

    <button type="button" id="z3reset" title="Reset the camera"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg><span class="lbl3">Reset</span></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// the title goes back to the page the visitor came from, when it is a Soundlore page
document.getElementById('brand').addEventListener('click',e=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back();}}catch(err){}});
</script>
<script>
'use strict';
// Genres below; above them one of two layers: instruments or artists. Each upper item sits at the weighted
// center of its genres. 2D shows one layer at a time and keeps the selection when switching; 3D shows the
// genre plane and the chosen upper plane, joined by lines.
// colors follow the theme: night ground (dark) or paper ground (light)
const PALS={dark:{bg:'#181A3C',dots:['#4C93EB','#E8693A','#25B585','#E0A21A','#E26A97','#4FB04F','#9C92F0','#EE7676','#8B91A6'],br:['#FFD166','#FF9E7A','#8FE3A0','#F7E26B','#9AD1FF','#D2B4FF','#FFA8C5','#E3E6F2'],ring:'#FFFFFF',planeHex:'#FFFFFF',planeA:.035,edgeHex:'#8B91C6',edgeA:.35,lines:{3:'#FFFFFF',2:'#C9CCF2',1:'#8F94C8'}},
  light:{bg:'#F3F5F9',dots:['#2A78D6','#EB6834','#1BAF7A','#D99500','#E05C93','#138A2E','#6250D6','#D9413F','#8E95A3'],br:['#B98300','#D2552A','#23935A','#9C8A00','#2C7FCC','#8456D1','#CF4680','#5F6584'],ring:'#1D2040',planeHex:'#1D2040',planeA:.045,edgeHex:'#1D2040',edgeA:.28,lines:{3:'#1D2040',2:'#4C5388',1:'#9AA0C4'}}};
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
let PAL=isDark()?PALS.dark:PALS.light,NIGHT=PAL.dots,BRANCH=PAL.br;
function setPal(){PAL=isDark()?PALS.dark:PALS.light;NIGHT=PAL.dots;BRANCH=PAL.br;if(MAP){buildChips();renderPanel();redraw();}}
addEventListener('themechange',setPal);
// a color blended with the ground, for the 3D points and lines
const mix=(hex,a)=>{const h=x=>parseInt(x.slice(1),16),n=h(hex),b=h(PAL.bg),c=[n>>16&255,n>>8&255,n&255],g=[b>>16&255,b>>8&255,b&255];return c.map((v,k)=>(v*a+g[k]*(1-a))/255);};
const W_NAME={3:'characteristic',2:'frequent',1:'occasional'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fmt=n=>n.toLocaleString('en-US');

let MAP,LAY,AD=null,G=[],I=[],A=[],AORD=[],ARANK=[],GORD=[],ALOAD=null,PENDING=null;
// layer: the layer shown in 2D (g, i or a); up: the upper plane in 3D (i or a)
const S={view:'2d',layer:'g',up:'i',vis:{g:true,i:true,a:false},sel:null,hover:null,branch:null,fam:null,all:false};
// the artist plane is larger than the genre plane: twice the area in 2D, 1.5 times in 3D
const A2=Math.SQRT2/0.8,A3=Math.sqrt(1.5);
const hasGL=typeof THREE!=='undefined'&&(()=>{try{const c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));}catch(e){return false;}})();
const NAMES={g:'genres',i:'instruments',a:'artists'};

Promise.all([fetch('genre_map.json').then(r=>r.json()),fetch('instrument_layer.json').then(r=>r.json())]).then(([m,l])=>{
  MAP=m;LAY=l;
  G=m.points.map((p,i)=>({t:'g',i,name:p[0],x:p[1],y:p[2],fam:p[3],big:p[4]?1:0,links:[],alinks:[]}));GORD=[...G].sort((a,b)=>b.big-a.big);
  I=l.items.map((a,i)=>({t:'i',i,uid:a[0],name:a[1],br:a[2],x:a[3],y:a[4],ax:a[5],ay:a[6],spread:a[7],links:a[8]}));
  for(const it of I)for(const [g,w] of it.links)G[g].links.push([it.i,w]);
  for(const g of G)g.links.sort((a,b)=>b[1]-a[1]);
  bind();fromHash();
  if(S.layer==='a'||S.up==='a'||(S.view==='3d'&&S.vis.a)||PENDING)loadArtists().then(()=>{applyPending();setView(S.view);}).catch(()=>{});
  setView(S.view);segs();note();buildChips();
  if(S.sel){resize2d();focus2d(S.sel);renderPanel();redraw();}
}).catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p style="position:absolute;top:80px;left:16px">Could not load the map data: ${esc(e.message)}</p>`);});

// ---------- artists (loaded only when their layer is first shown)
function loadArtists(){if(ALOAD)return ALOAD;$('#note').textContent='Loading the artists…';showLoading(true);
  ALOAD=fetch('artists.json').then(r=>{if(!r.ok)throw new Error('artists.json: HTTP '+r.status);return r.json();}).then(d=>{AD=d;
    const gi=Object.fromEntries(G.map(g=>[g.name,g.i]));

        votes:gs,rel:(r[9]||0)+(r[7]?2:0),links:gs.map(([g,v])=>[g,v/tw>=.5?3:v/tw>=.2?2:1])};

    showLoading(false);buildChips();note();}).catch(e=>{showLoading(false);ALOAD=null;$('#note').textContent='The artists could not be loaded: '+e.message;throw e;});

function showLoading(on){let el=$('#loading');if(on&&!el){document.body.insertAdjacentHTML('beforeend','<div id="loading" class="loading">Loading the artists…</div>');}else if(!on&&el)el.remove();}
function applyPending(){if(!PENDING)return;const a=A.find(x=>x.id===PENDING);PENDING=null;if(a){S.sel={t:'a',i:a.i};renderPanel();if(S.view==='2d'){resize2d();focus2d(S.sel);}redraw();}}

// ---------- selection model
const arr=t=>t==='g'?G:t==='i'?I:A;
const item=r=>r?arr(r.t)[r.i]:null;
// the layer a genre is linked to: the one shown in 2D, else the upper plane
const otherOfG=()=>S.view==='2d'&&S.layer!=='g'?S.layer:S.up;
function linked(r){const o=item(r);if(!o)return [];
  const li=()=>o.links.map(([j,w])=>({t:'i',i:j,w})),la=()=>o.alinks.map(([j,w,v])=>({t:'a',i:j,w,v}));
  if(r.t==='g'){if(S.view==='3d')return [...(S.vis.i?li():[]),...(S.vis.a?la():[])];return otherOfG()==='i'?li():la();}
  if(r.t==='a')return o.links.map(([g,w],k)=>({t:'g',i:g,w,v:o.votes[k][1]}));
  return o.links.map(([g,w])=>({t:'g',i:g,w}));}
function visible(o){return o.t==='i'?S.branch===null||o.br===S.branch:o.t==='a'?S.fam===null||o.fam===S.fam:true;}
function select(r,{focus=true}={}){S.sel=r;S.hover=null;

// address: #[embed/][3d/][li/ | la/ | ua/](g/<genre> | i/<SL id> | a/<MBID>)
//   embed: shown inside the explorer's map, which owns the layer and view switches
//   3d: the 3D view; li / la: instruments / artists shown in 2D; ua: artists as the upper plane in 3D
const EMBED=/^#embed(\/|$)/.test(location.hash);
if(EMBED)document.documentElement.classList.add('embed');
function selKey(r){return r?`${r.t}/${encodeURIComponent(r.t==='g'?G[r.i].name:r.t==='i'?I[r.i].uid:A[r.i].id)}`:'';}
function writeHash(){const sel=selKey(S.sel);
  const vl=['g','i','a'].filter(t=>S.vis[t]).join('');const flag=S.view==='3d'?(vl==='gi'?'':'v'+vl):(S.layer==='i'?'li':S.layer==='a'?'la':'');
  const parts=[EMBED?'embed':'',S.view==='3d'?'3d':'',flag,sel].filter(Boolean);
  history.replaceState(null,'',parts.length?'#'+parts.join('/'):location.pathname+location.search);}
function parseHash(){let parts=decodeURIComponent(location.hash.slice(1)).split('/');const o={view:'2d',layer:'g',up:null,vis:null,sel:null,pending:null};
  while(parts.length&&(['embed','3d','li','la','ua'].includes(parts[0])||/^v[gia]+$/.test(parts[0]))){const f=parts.shift();if(f==='3d')o.view='3d';if(f==='li'){o.layer='i';o.up='i';}if(f==='la'){o.layer='a';o.up='a';}
    if(f==='ua')o.vis={g:true,i:false,a:true};if(/^v[gia]+$/.test(f))o.vis={g:f.includes('g'),i:f.includes('i'),a:f.includes('a')};}
  const t=parts[0],k=parts.slice(1).join('/');
  if(t==='g'){const g=G.find(x=>x.name===k);if(g)o.sel={t:'g',i:g.i};}
  if(t==='i'){const it=I.find(x=>x.uid===k);if(it){o.sel={t:'i',i:it.i};if(o.view==='2d')o.layer='i';o.up='i';}}
  if(t==='a'){if(o.view==='2d')o.layer='a';o.up='a';const a=A.find(x=>x.id===k);if(a)o.sel={t:'a',i:a.i};else o.pending=k;}
  return o;}
function fromHash(){const o=parseHash();S.view=o.view;S.layer=o.layer;if(o.up)S.up=o.up;if(o.vis)S.vis=o.vis;if(o.sel)S.sel=o.sel;PENDING=o.pending;}
// the explorer drives the embedded view by changing the address
addEventListener('hashchange',()=>{if(!MAP)return;const o=parseHash();
  const go=()=>{S.layer=o.layer;if(o.up)S.up=o.up;if(o.vis)S.vis=o.vis;S.view=o.view;setView(o.view);segs();buildChips();note();
    const sel=o.sel||(o.pending?(()=>{const a=A.find(x=>x.id===o.pending);return a?{t:'a',i:a.i}:null;})():null);
    const same=(a,b)=>(!a&&!b)||(a&&b&&a.t===b.t&&a.i===b.i);if(!same(sel,S.sel))select(sel);centerOnArtists();redraw();};
  if((o.layer==='a'||o.up==='a'||(o.vis&&o.vis.a)||o.pending)&&!AD)loadArtists().then(go);else go();});
// find from the explorer's search box: the best match on the visible layers
window.slFind=function(q){q=norm(String(q||'').trim());if(!q)return null;
  const pool=S.view==='3d'?[...(S.vis.i?I:[]),...(S.vis.a?A:[]),...G]:S.layer==='g'?G:[...arr(S.layer),...G];
  const hit=pool.find(x=>norm(x.name)===q)||pool.find(x=>norm(x.name).startsWith(q))||pool.find(x=>norm(x.name).includes(q));
  if(hit){if(S.view==='2d')setLayer(hit.t);select({t:hit.t,i:hit.i});}return hit?hit.name:null;};
window.slSelected=()=>{const r=S.sel;if(!r)return null;const o=item(r);return {t:r.t,name:o.name,uid:r.t==='i'?o.uid:null,id:r.t==='a'?o.id:null};};

const spreadText=(o,what)=>o.spread==null?'':o.spread<0.03?`Its genres sit close together on the map: a focused ${what}.`:o.spread<0.12?'Its genres spread over part of the map.':`Its genres are spread across the map: a genre-crossing ${what}.`;
const swOf=o=>o.t==='g'?`<span class="sw" style="background:${NIGHT[o.fam]}"></span>`:o.t==='i'?`<span class="sw ring" style="background:${BRANCH[o.br]}"></span>`:`<span class="sw sq" style="background:${NIGHT[o.fam]}"></span>`;
function renderPanel(){const p=$('#panel');const o=item(S.sel);if(!o){p.hidden=true;return;}
  const L=linked(S.sel);const t=S.sel.t;const other=t==='g'?(S.view==='3d'?['i','a'].filter(x=>S.vis[x]).map(x=>NAMES[x]).join(' and ')||'items':NAMES[otherOfG()]):'genres';
  const head=t==='g'?`<div class="kind">${swOf(o)} Genre · ${esc(MAP.families[o.fam])}</div><h2>${esc(o.name)}</h2>`
    :t==='i'?`<div class="kind">${swOf(o)} Instrument · ${esc(LAY.branches[o.br])}</div><h2>${esc(o.name)}</h2>`
    :`<div class="kind">${swOf(o)} ${esc([o.type||'Artist',o.area].filter(Boolean).join(' · '))}</div><h2>${esc(o.name)}</h2>`;
  const nI=L.filter(l=>l.t==='i').length,nA=L.filter(l=>l.t==='a').length;
  const desc=t==='g'&&S.view==='3d'?`<p>${[S.vis.i?`${nI} instrument${nI===1?'':'s'}`:'',S.vis.a?(AD?`${fmt(nA)} artist${nA===1?'':'s'}`:'artists loading'):''].filter(Boolean).join(' · ')||'Show the instruments or the artists to see what it links to.'}</p>`:t==='g'?`<p>${L.length?(otherOfG()==='i'?`Uses ${L.length} instrument${L.length>1?'s':''} of the thesaurus.`:`${fmt(L.length)} artist${L.length>1?'s have':' has'} it among their genres.`):otherOfG()==='a'&&!AD?'Loading the artists…':otherOfG()==='i'?'Its profile names no instrument.':'No artist in the selection has this genre.'}</p>`
    :t==='i'?`<p>Used by ${L.length} genre${L.length>1?'s':''}. ${spreadText(o,'instrument')}</p>`
    :`<p>${L.length} genre${L.length>1?'s':''}${o.src?' from Wikidata':', from MusicBrainz votes'}. ${spreadText(o,'artist')}</p>`;
  const wcol=l=>l.t==='a'?(l.v!=null?`${l.v} vote${l.v>1?'s':''}`:''):t==='a'?(o.src?'Wikidata':`${l.v} vote${l.v>1?'s':''}`):W_NAME[l.w];

  const more=L.length>60?`<p>and ${fmt(L.length-60)} more.</p>`:'';
  const links=t==='g'?`<a class="btn" target="_top" href="explore.html#genres/${encodeURIComponent(o.name)}">Genre record</a>${otherOfG()==='a'&&L.length?`<a class="btn" target="_top" href="explore.html#artists/genre/${encodeURIComponent(o.name)}">All its artists</a>`:''}`
    :t==='i'?`<a class="btn" target="_top" href="thesaurus.html#${o.uid}">Thesaurus</a><a class="btn" target="_top" href="explore.html#concepts/${o.uid}">Explorer</a>`
    :`<a class="btn" target="_top" href="explore.html#artists/${o.id}">Artist record</a><a class="btn" target="_blank" rel="noopener" href="https://musicbrainz.org/artist/${o.id}">MusicBrainz</a>`;
  p.innerHTML=`<div class="h"><div>${head}</div><button class="x" type="button" id="px" aria-label="Clear selection">×</button></div>${desc}<div class="links">${links}</div>${L.length?`<div class="kind">Linked ${other}, strongest first</div><div class="nb">${rows}</div>${more}`:''}`;

}

// legend chips filter the upper layer: instrument families or artist genre families
function chipLayer(){return S.view==='3d'?(S.vis.a&&!S.vis.i?'a':'i'):S.layer==='g'?S.up:S.layer;}
function buildChips(){const t=chipLayer();const lt=$('#lt');if(lt)lt.textContent=t==='a'?'Artists by genre family':'Instrument families';
  if(t==='a'){$('#chips').innerHTML=MAP.families.map((b,i)=>`<button class="chip" type="button" data-b="${i}" aria-pressed="${S.fam===i}"><span class="sw sq" style="background:${NIGHT[i]}"></span>${esc(b)}</button>`).join('');$('#chips').setAttribute('aria-label','Show the artists of one family');}
  else{$('#chips').innerHTML=LAY.branches.map((b,i)=>`<button class="chip" type="button" data-b="${i}" aria-pressed="${S.branch===i}"><span class="sw ring" style="background:${BRANCH[i]}"></span>${esc(b)}</button>`).join('');$('#chips').setAttribute('aria-label','Show one instrument family');}
  $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const b=+c.dataset.b;if(t==='a')S.fam=S.fam===b?null:b;else S.branch=S.branch===b?null:b;
    $('#chips').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.b===(t==='a'?S.fam:S.branch)));redraw();});

function note(){const n=$('#note');

  else n.textContent='Drag to rotate, right-drag or Shift-drag to pan, wheel or pinch to zoom.';}

// ---------- search (standalone page)
function bindSearch(){const q=$('#q'),sg=$('#sugg');let hits=[],on=0;
  const show=()=>{const v=norm(q.value.trim());if(!v){sg.hidden=true;return;}
    const up=S.view==='3d'?S.up:S.layer==='g'?S.up:S.layer;
    const a=[...arr(up).filter(x=>norm(x.name).includes(v)).slice(0,5),...G.filter(x=>norm(x.name).includes(v)).slice(0,7)];
    hits=a;on=0;sg.innerHTML=a.map((x,k)=>`<button type="button" data-k="${k}" class="${k===0?'on':''}">${swOf(x)}${esc(x.name)}<small>${x.t==='g'?'genre':x.t==='i'?'instrument':'artist'}</small></button>`).join('')||'<button type="button" disabled>No match</button>';
    sg.hidden=false;sg.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k));};
  const pick=k=>{const x=hits[k];if(!x)return;sg.hidden=true;q.value='';if(S.view==='2d')setLayer(x.t);select({t:x.t,i:x.i});};
  q.addEventListener('input',show);
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();on=(on+(e.key==='ArrowDown'?1:-1)+hits.length)%Math.max(1,hits.length);sg.querySelectorAll('[data-k]').forEach((b,k)=>b.classList.toggle('on',k===on));}
    else if(e.key==='Enter'){pick(on);}else if(e.key==='Escape'){sg.hidden=true;}});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))sg.hidden=true;});
}

// ---------- view switching
function bind(){
  $('#v2').onclick=()=>setView('2d');$('#v3').onclick=()=>setView('3d');
  if(!hasGL){$('#v3').disabled=true;$('#v3').title='3D needs WebGL, which this browser does not offer';}
  $('#lg').onclick=()=>setLayer('g',true);$('#li').onclick=()=>setLayer('i',true);$('#la').onclick=()=>setLayer('a',true);
  $('#all').onchange=e=>{S.all=e.target.checked;redraw();};
  document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>camPreset(b.dataset.cam,true));
  $('#z3in').onclick=()=>zoomAt(1/1.6,R3.W3/2,R3.H3/2,true);$('#z3out').onclick=()=>zoomAt(1.6,null,null,true);$('#z3reset').onclick=()=>camPreset('tilt',true);
  addEventListener('keydown',e=>{if(S.view!=='3d'||document.activeElement.tagName==='INPUT')return;if(e.key==='+'||e.key==='=')zoomAt(1/1.4,R3.W3/2,R3.H3/2,true);else if(e.key==='-')zoomAt(1.4,null,null,true);});
  addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel&&document.activeElement.tagName!=='INPUT')select(null);});
  bindSearch();
  new ResizeObserver(()=>{resize2d();resize3d();redraw();}).observe($('#stage'));
}
function segs(){$('#v2').setAttribute('aria-pressed',S.view==='2d');$('#v3').setAttribute('aria-pressed',S.view==='3d');
  for(const [id,t] of [['#lg','g'],['#li','i'],['#la','a']])$(id).setAttribute('aria-pressed',S.view==='3d'?!!S.vis[t]:S.layer===t);}
function setView(v){if(v==='3d'&&!hasGL)v='2d';S.view=v;segs();$('#tools').hidden=v!=='3d';$('#hint3').hidden=v!=='3d';if(v==='3d'&&S.vis.a&&!AD)loadArtists().then(()=>{renderPanel();redraw();}).catch(()=>{});
  $('#c2').style.display=v==='2d'?'block':'none';
  if(v==='3d'){init3d();R3.canvas.style.display='block';resize3d();}else if(R3.canvas)R3.canvas.style.display='none';
  $('#tip').hidden=true;note();buildChips();renderPanel();redraw();if(MAP)writeHash();}
function setLayer(t,fromClick){
  if(S.view==='3d'){if(!fromClick){if(!S.vis[t]){S.vis[t]=true;}else return;}else{const n={...S.vis,[t]:!S.vis[t]};if(!n.g&&!n.i&&!n.a)return;S.vis=n;}}
  else{if(S.layer===t)return;S.layer=t;if(t!=='g')S.up=t;}
  const apply=()=>{segs();note();buildChips();renderPanel();
    // the artist plane is larger than the genre frame: center on the selected genre's artists
    centerOnArtists();redraw();writeHash();};
  if((t==='a'||(S.view==='3d'&&S.vis.a))&&!AD){apply();loadArtists().then(apply).catch(()=>{});}else apply();}
function centerOnArtists(){if(S.view==='2d'&&S.layer==='a'&&AD&&S.sel&&S.sel.t==='g'){const L=G[S.sel.i].alinks.slice(0,60).map(l=>A[l[0]]);if(L.length){const cx=L.reduce((s,o)=>s+o.x,0)/L.length,cy=L.reduce((s,o)=>s+o.y,0)/L.length;focus2d({_o:{x:cx,y:cy}});}}}
function redraw(){if(!MAP)return;if(S.view==='2d')draw2d();else draw3d();}

// ---------- 2D
const V2={k:1,x:0,y:0,W:0,H:0,ctx:null};const PAD=30;
function resize2d(){const c=$('#c2');const r=$('#stage').getBoundingClientRect(),d=devicePixelRatio||1;V2.W=r.width;V2.H=r.height;c.width=r.width*d;c.height=r.height*d;V2.ctx=c.getContext('2d');V2.ctx.setTransform(d,0,0,d,0,0);}
const top2=()=>EMBED?16:Math.min(110,V2.H*.16);
function scr(x,y){const t=top2();return [(PAD+x*(V2.W-2*PAD))*V2.k+V2.x,(t+y*(V2.H-t-PAD))*V2.k+V2.y];}
function focus2d(r){const o=r&&r._o?r._o:item(r);if(!o)return;const k=Math.max(V2.k,1.8);const t=top2();V2.k=k;V2.x=V2.W/2-(PAD+o.x*(V2.W-2*PAD))*k;V2.y=(V2.H+t)/2-(t+o.y*(V2.H-t-PAD))*k;}
function draw2d(){const c=V2.ctx;if(!c)return;c.clearRect(0,0,V2.W,V2.H);
  const lt=S.layer,lay=lt==='a'?AORD:arr(lt);const sel=S.sel;const hot=new Map();
  if(sel){if(sel.t===lt)hot.set(sel.i,4);for(const l of linked(sel))if(l.t===lt)hot.set(l.i,l.w);}
  const r0=lt==='g'?Math.max(2.2,Math.min(6,2.4*Math.sqrt(V2.k))):lt==='i'?Math.max(3.5,Math.min(8,4*Math.sqrt(V2.k))):Math.max(1.1,Math.min(4,1.2*Math.sqrt(V2.k)));
  const dimmed=o=>(sel&&!hot.has(o.i))||!visible(o);
  if(lt==='a'){ // many points: small squares, one fill color at a time
    for(const pass of [true,false]){let col=null;c.globalAlpha=pass?(sel?.1:.18):.9;
      for(const o of lay){if(dimmed(o)!==pass)continue;const [x,y]=scr(o.x,o.y);if(x<-4||y<-4||x>V2.W+4||y>V2.H+4)continue;
        const cc=NIGHT[o.fam];if(cc!==col){c.fillStyle=cc;col=cc;}const r=hot.get(o.i)===4?r0+3:r0;c.fillRect(x-r,y-r,2*r,2*r);}}
    if(sel&&sel.t==='a'){const o=A[sel.i];const [x,y]=scr(o.x,o.y);c.globalAlpha=1;c.lineWidth=2;c.strokeStyle=PAL.ring;c.strokeRect(x-r0-5,y-r0-5,2*r0+10,2*r0+10);}
  }else for(const pass of [true,false])for(const o of lay){if(dimmed(o)!==pass)continue;const [x,y]=scr(o.x,o.y);if(x<-12||y<-12||x>V2.W+12||y>V2.H+12)continue;
    c.globalAlpha=pass?(sel?.12:.2):.95;const col=o.t==='g'?NIGHT[o.fam]:BRANCH[o.br];
    const r=o.t==='g'?r0:r0*(hot.get(o.i)===4?1.5:1);c.fillStyle=col;c.beginPath();c.arc(x,y,hot.get(o.i)===4?r+2:r,0,6.283);c.fill();
    if(o.t==='i'){c.lineWidth=1.2;c.strokeStyle=PAL.ring;c.globalAlpha=pass?.15:.8;c.stroke();}}
  c.globalAlpha=1;
  // labels (a grid keeps them from piling up)
  const L=$('#labels');let h='';const used=new Set();
  const lab=(o,big)=>{const [x,y]=scr(o.x,o.y);if(x<0||y<0||x>V2.W||y>V2.H)return'';const key=Math.round(x/110)+','+Math.round(y/18);if(!big&&used.has(key))return'';used.add(key);return `<div class="lab ${big?'big':''}" style="left:${x}px;top:${y}px">${esc(o.name)}</div>`;};
  if(sel){if(sel.t===lt)h+=lab(item(sel),true);
    linked(sel).filter(l=>l.t===lt).slice(0,14).forEach(l=>h+=lab(item(l),false));
    if(sel.t!==lt){const n=linked(sel).filter(l=>l.t===lt).length;h+=`<div class="lab plane" style="left:16px;top:${top2()+4}px;transform:none">${fmt(n)} ${lt==='g'?(sel.t==='a'?'genres of':'genres use'):lt==='i'?'instruments in':'artists with'} ${esc(item(sel).name)}</div>`;}}
  else if(lt==='i'&&V2.k>=1.6){for(const o of I)if(visible(o))h+=lab(o,false);}
  else if(lt==='a'&&V2.k>=2.2){let n=0;for(const o of A){if(!visible(o))continue;const s=lab(o,false);if(s){h+=s;if(++n>=90)break;}}}
  L.innerHTML=h;
}

// ---------- 3D (three.js r128 from cdnjs)

function lines3d(){const segs=[];

// fast projection with the combined camera matrix (no object per point)

function labels3d(){let h='';const L=$('#labels');

// close up, the names of the genres and artists in view, the best documented first, without overlaps
function zoomLabels(){const d=R3.orb.d;if(d>9)return'';const W=R3.W3,H=R3.H3,used=new Set();let h='',n=0;

function pick3d(mx,my){if(!R3.pm)return null;let best=null,bd;

  bd=12*12;if(S.vis.i)for(const o of I)if(visible(o))test(o);if(best)return best;
  bd=8*8;if(S.vis.g)for(const o of G)test(o);if(best)return best;
  bd=7*7;if(S.vis.a&&AD)for(const o of A)if(visible(o))test(o);return best;}
function bind3d(){const c=R3.canvas;const pts=new Map();let drag=null,moved=false,pinch=null,raf=0;
  c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=false;

const DMIN=.3,DMAX=45;
// the point of the scene under the cursor: the item under it, else the densest visible plane
function groundAt(mx,my){const p=pick3d(mx,my);if(p&&(p.t==='a'||!(S.vis.a&&AD)))return new THREE.Vector3(...P3(p));

function flyTo(p){const [x,y,z]=P3(p);animCam({tx:x,ty:y,tz:z,d:Math.min(R3.orb.d,p.t==='a'?1.4:2.6)},700);select({t:p.t,i:p.i});}
